name: Sync Shikimori Daily Snapshot

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Shikimori + AniList snapshot
        run: node scripts/sync-snapshot.mjs

      - name: Commit and push updated snapshot
        run: |
          if git diff --quiet assets/data/snapshot.json && [ -z "$(git ls-files --others --exclude-standard assets/data/snapshot.json)" ]; then
            echo "Snapshot unchanged — skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/snapshot.json
          git commit -m "chore(snapshot): sync Shikimori + AniList data ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
